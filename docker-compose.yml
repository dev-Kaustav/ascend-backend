services:
  app:
    build: .
    env_file: .env

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      # Do NOT set FORWARDED_ALLOW_IPS="*": uvicorn would then take the LEFTMOST X-Forwarded-For
      # entry as the client, which any visitor can forge. The rate limiter reads the LAST entry
      # itself (the one nginx's `$proxy_add_x_forwarded_for` appends), see rate_limit.client_ip.

    restart: unless-stopped